<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06362a" />
    <title>Sin conexión · Rapitrip</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f4f8f5; color: #14231d; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 340px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: #55645d; line-height: 1.5; margin: 0 0 20px; }
      button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #0b7a57; color: #fff; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay señal en este momento. Lo que ya subiste está a salvo. Vuelve a intentarlo cuando tengas conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
