<!doctype html>
<html lang="es"><body style="font-family:Arial,sans-serif;color:#1a1a1a;max-width:560px;margin:0 auto;padding:24px">
  <h2 style="margin:0 0 16px">Confirma tu correo en Rapitrip</h2>
  <p>Para terminar de crear tu cuenta, escribe este código en la página de registro:</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:8px;margin:16px 0;padding:14px 0;text-align:center;background:#f1f6f4;border-radius:12px">{{ .Token }}</p>
  <p>También puedes confirmar con un solo clic:</p>
  <p><a href="{{ .ConfirmationURL }}">Confirmar mi correo</a></p>
  <p style="color:#666;font-size:12px">El código vence en 1 hora. Si no creaste una cuenta en Rapitrip, ignora este mensaje.</p>
</body></html>
