project_id = "rapitrip"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[auth]
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3001"]
jwt_expiry = 300
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[functions.purge-exports]
verify_jwt = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[functions.accept-invitation]
verify_jwt = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
inactivity_timeout = "10m"

[functions.send-outbox]
verify_jwt = false