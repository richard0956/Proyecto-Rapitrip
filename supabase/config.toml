project_id = "rapitrip"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[auth]
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3001"]
jwt_expiry = 300
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
# Auth también exige minúscula, mayúscula, número y símbolo, para que la regla no se pueda saltar llamando a la API directamente.
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email.template.confirmation]
subject = "Confirma tu correo en Rapitrip"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de Rapitrip"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirma el cambio de correo en Rapitrip"
content_path = "./supabase/templates/email_change.html"


[functions.purge-exports]
verify_jwt = false

[functions.purge-evidence]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[functions.accept-invitation]
verify_jwt = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 3600

# Correo de cuentas (confirmación, recuperación, cambio de correo).
# LOCAL (por defecto): no hay SMTP y los correos caen en el buzón de pruebas http://127.0.0.1:54324, para registrar cualquier correo.
# REAL (Resend): descomenta el bloque, deja la API key en supabase/.env (RESEND_API_KEY) y reinicia con `pnpm db:stop` + `pnpm db:start`.
# Sin dominio verificado en Resend, el remitente solo puede ser onboarding@resend.dev y solo entrega al correo dueño de la cuenta
# de Resend; para cualquier destinatario hay que verificar un dominio propio y usar un remitente de ese dominio.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "onboarding@resend.dev"
# sender_name = "Rapitrip"

# Con SMTP propio Auth limita los correos por hora (por defecto 2): se sube para poder probar registros y recuperaciones sin esperar.
# En producción conviene un valor acorde al tráfico real.
[auth.rate_limit]
email_sent = 30

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Ingreso con Google (tienda). Para activarlo: crea el cliente OAuth en Google Cloud, define
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID y SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET y pon enabled = true.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# CAPTCHA (Cloudflare Turnstile). Desactivado hasta tener la clave secreta; ver docs/fase-1-puesta-en-marcha.md.
# Al activarlo, Supabase exige el token en login, registro y recuperación; los formularios ya lo envían.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.sessions]
inactivity_timeout = "15m"

[functions.send-outbox]
verify_jwt = false

# Pagos con tarjeta: el webhook se autentica con la firma de Stripe y el reembolso con el secreto interno, no con un JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.process-refunds]
verify_jwt = false

# Sin analítica local (Logflare/Vector): consume cientos de MB y con poca memoria en Docker reinicia la base de datos. Solo daba la vista de registros de Studio.
[analytics]
enabled = false
