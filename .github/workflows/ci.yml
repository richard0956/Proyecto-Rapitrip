name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Configurar el backend aislado de CI
        run: node scripts/ci/configure-supabase.mjs

      # Aplica migraciones y seeds de prueba. Auth debe correr porque crea el esquema `auth`.
      - name: Levantar Supabase local
        run: supabase start

      - name: Pruebas de base de datos (pgTAP)
        run: supabase test db

      - name: Lint de la base de datos
        run: supabase db lint --level warning

      - name: Pruebas de Edge Functions
        run: pnpm fn:test

      - name: Los tipos generados están al día
        run: |
          pnpm db:types
          git diff --exit-code packages/db-types

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Valores de relleno: estas comprobaciones no necesitan backend. Los flujos con Supabase se corren a mano (e2e/README.md).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias y de componentes
        run: pnpm --workspace-concurrency=1 -r --if-present test --maxWorkers=2 --minWorkers=1

      - name: Compilar la consola
        run: pnpm --filter @rapitrip/console build

      - name: Compilar la tienda
        run: pnpm --filter @rapitrip/store build

      - name: Compilar la app del repartidor
        run: pnpm --filter @rapitrip/courier build

      - name: Instalar Chromium
        run: pnpm --filter @rapitrip/e2e exec playwright install --with-deps chromium

      - name: Accesibilidad (axe, WCAG 2.2 AA) y movimiento
        run: pnpm e2e:front

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Operación completa con backend real: comercio (tiendas, catálogo con imágenes en Storage, inventario, pedidos), caja, coordinación,
  # administración y un pedido de punta a punta entre los cuatro. Necesita las Edge Functions sirviéndose, porque las cuentas de caja,
  # coordinación y administración se crean aceptando invitaciones (`accept-invitation`). Los E2E de Stripe quedan fuera: usan claves de prueba personales.
  e2e-operaciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Configurar el backend aislado de CI
        run: node scripts/ci/configure-supabase.mjs

      - name: Levantar Supabase local
        run: supabase start

      # Las variables públicas se incrustan al compilar: por eso las apps se compilan después de levantar Supabase.
      - name: Variables de Supabase local
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Servir las Edge Functions
        run: |
          printf 'OUTBOX_SECRET=ci-%s%s\nMAIL_MODE=log\nSTORE_URL=http://127.0.0.1:3000\nCONSOLE_URL=http://127.0.0.1:3001\nCOURIER_APP_URL=http://127.0.0.1:3002\n' "$RANDOM" "$RANDOM" > supabase/functions/.env
          nohup supabase functions serve > functions.log 2>&1 &
          # La primera llamada tarda por la compilación en frío (puede agotar el CPU y fallar): se reintenta hasta que responda 400
          # (token ausente), que es la respuesta normal de `accept-invitation` a una petición vacía.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/accept-invitation" -H "content-type: application/json" -d '{}' || true)
            if [ "$code" = "400" ]; then echo "Edge Functions listas"; exit 0; fi
            sleep 3
          done
          echo "Las Edge Functions no respondieron a tiempo"; cat functions.log; exit 1

      - name: Compilar la consola
        run: pnpm --filter @rapitrip/console build

      - name: Compilar la tienda
        run: pnpm --filter @rapitrip/store build

      - name: Compilar la app del repartidor
        run: pnpm --filter @rapitrip/courier build

      - name: Instalar Chromium
        run: pnpm --filter @rapitrip/e2e exec playwright install --with-deps chromium

      - name: E2E de operaciones (comercio, caja, coordinación, administración y pedido de punta a punta)
        run: pnpm e2e:operaciones

      - name: Informe de Playwright y registro de las funciones
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-operaciones
          path: |
            e2e/playwright-report
            functions.log
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  containers:
    name: container-${{ matrix.app }}
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [store, console, dealer]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          load: true
          push: false
          tags: rapitrip-ci:${{ matrix.app }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            NEXT_PUBLIC_SUPABASE_URL=https://ci.example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.app }}.example.com
          cache-from: type=gha,scope=production-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.app }}

      - name: Comprobar el arranque sin sesión ni backend
        env:
          IMAGE: rapitrip-ci:${{ matrix.app }}
        run: |
          docker run -d --name rapitrip-smoke --network none -e PORT=8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec rapitrip-smoke node /app/scripts/docker/healthcheck-production.mjs; then
              echo "La imagen responde HTTP 200 en /api/health con PORT=8080"
              exit 0
            fi
            sleep 2
          done
          docker logs rapitrip-smoke
          exit 1

      - name: Detener el contenedor de prueba
        if: always()
        run: docker rm -f rapitrip-smoke || true
