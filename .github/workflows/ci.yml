name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Aplica migraciones y seeds de prueba. Auth debe correr porque crea el esquema `auth`.
      - name: Levantar Supabase local
        run: supabase start

      - name: Pruebas de base de datos (pgTAP)
        run: supabase test db

      - name: Lint de la base de datos
        run: supabase db lint --level warning

      - name: Pruebas de Edge Functions
        run: pnpm fn:test

      - name: Pruebas de paquetes
        run: pnpm test

      - name: Los tipos generados están al día
        run: |
          pnpm db:types
          git diff --exit-code packages/db-types

      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Valores de relleno: estas comprobaciones no necesitan backend. Los flujos con Supabase se corren a mano (e2e/README.md).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias y de componentes
        run: pnpm test

      - name: Compilar la consola
        run: pnpm --filter @rapitrip/console build

      - name: Compilar la tienda
        run: pnpm --filter @rapitrip/store build

      - name: Instalar Chromium
        run: pnpm --filter @rapitrip/e2e exec playwright install --with-deps chromium

      - name: Accesibilidad (axe, WCAG 2.2 AA) y movimiento
        run: pnpm e2e:front

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
